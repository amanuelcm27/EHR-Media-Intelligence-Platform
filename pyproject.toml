[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr-media-intelligence"
version = "1.0.0"
description = "AI-powered EHR media ingestion, FHIR R4 normalization, summarization and semantic search"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Onye AI Full-stack Assessment" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dateutil>=2.9",
  "httpx>=0.27",
  "fhir.resources>=8.3,<9",
  "numpy>=1.26",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
llm = ["anthropic>=0.34", "openai>=1.40"]

[project.scripts]
ehr-media = "ehr_media.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:fhir.resources.*",
  "ignore::UserWarning:.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
